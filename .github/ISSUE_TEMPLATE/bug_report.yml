name: Bug report
description: Report reproducible behavior that appears incorrect.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve this project. Search existing issues before submitting a report. Do not include secrets or undisclosed vulnerabilities.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a matching report.
          required: true
        - label: This is not a private security vulnerability.
          required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the problem and its impact clearly.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reliable sequence, repository, or code sample that reproduces the problem.
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant project version, operating system, runtime, architecture, and configuration.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Add sanitized logs, traces, screenshots, or related links if useful.
