name: Feature request
description: Propose a focused improvement to an existing project.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Explain the problem before the solution. Significant architecture or compatibility changes may require a separate public proposal.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and proposals for related work.
          required: true
        - label: This request is within the scope of this repository.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user, contributor, or operational problem should be solved?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behavior or interface you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe current workarounds or other approaches you evaluated.

  - type: textarea
    id: impact
    attributes:
      label: Compatibility and operational impact
      description: Note possible API, data, performance, security, deployment, or migration effects.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, references, diagrams, or prior discussion if useful.
